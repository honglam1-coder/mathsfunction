<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin:0; padding:8px; font-family: Arial; background:#fff; }
    .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; }
    button{
      height:40px; font-size:18px; border:1px solid #cfd3d9;
      border-radius:8px; background:#fff; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="grid">
    <button onclick="ins('²')">x²</button>
    <button onclick="ins('³')">x³</button>
    <button onclick="ins('√')">√</button>
    <button onclick="ins('÷')">÷</button>

    <button onclick="ins('×')">×</button>
    <button onclick="ins('±')">±</button>
    <button onclick="ins('≤')">≤</button>
    <button onclick="ins('≥')">≥</button>

    <button onclick="ins('(')">(</button>
    <button onclick="ins(')')">)</button>
    <button onclick="back()">←</button>
    <button onclick="clr()">Clear</button>
  </div>

<script>
  // optional: force a specific entry by Accessibility Name:
  const TARGET = null; // e.g. "MathEntry1"

  function post(msg){
    parent.postMessage(msg, "*");
  }
  function ins(symbol){
    post({ type: "SL_MATH_SYMBOL", action:"insert", symbol, target: TARGET });
  }
  function back(){
    post({ type: "SL_MATH_SYMBOL", action:"back", target: TARGET });
  }
  function clr(){
    post({ type: "SL_MATH_SYMBOL", action:"clear", target: TARGET });
  }
</script>
</body>
</html>
